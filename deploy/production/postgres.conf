listen_addresses = '*'
port = 5432
max_connections = 32
shared_buffers = 128MB
work_mem = 2MB
maintenance_work_mem = 32MB
effective_cache_size = 512MB
max_wal_size = 512MB
min_wal_size = 80MB
ssl = on
ssl_cert_file = '/run/holoul-postgres-tls/server.crt'
ssl_key_file = '/run/holoul-postgres-tls/server.key'
ssl_min_protocol_version = 'TLSv1.2'
hba_file = '/etc/holoul/pg_hba.conf'
password_encryption = 'scram-sha-256'
log_statement = 'none'
log_min_error_statement = panic
log_parameter_max_length_on_error = 0
logging_collector = off
