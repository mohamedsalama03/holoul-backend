include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
fastcgi_param DOCUMENT_ROOT /var/www/html/public;
fastcgi_param HTTPS on;
fastcgi_param SERVER_PORT 443;
fastcgi_param HTTP_HOST holoul.com.ly;
fastcgi_param HTTP_X_REQUEST_ID $correlation_id;
fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
fastcgi_param HTTP_X_FORWARDED_HOST holoul.com.ly;
fastcgi_param HTTP_X_FORWARDED_PROTO https;
fastcgi_param HTTP_X_FORWARDED_PORT 443;
fastcgi_param HTTP_X_REAL_IP $remote_addr;
fastcgi_param HTTP_FORWARDED "";
fastcgi_param HTTP_X_FORWARDED_PREFIX "";
fastcgi_param HTTP_PROXY "";
fastcgi_pass application;
fastcgi_read_timeout 40s;
fastcgi_next_upstream off;
fastcgi_hide_header X-Powered-By;
fastcgi_hide_header X-Request-ID;
fastcgi_hide_header Cache-Control;
add_header X-Request-ID $correlation_id always;
add_header Cache-Control $api_cache_control always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
