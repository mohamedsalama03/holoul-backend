pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/json;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $request_id $generated_request_id {
        "~^(.{8})(.{4}).(.{3}).(.{3})(.{12})$" "$1-$2-4$3-8$4-$5";
    }
    map $http_x_request_id $correlation_id {
        "~^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$" $http_x_request_id;
        default $generated_request_id;
    }
    map $http_host $canonical_host {
        default 0;
        holoul.com.ly 1;
        holoul.com.ly:443 1;
    }
    map "$request_method|$uri|$status" $api_cache_control {
        default "private, no-store";
        ~^(GET|HEAD)\|/api/v1/public/portfolio/(projects|categories)\|200$ "public, max-age=0, s-maxage=60, must-revalidate";
        ~^(GET|HEAD)\|/api/v1/public/portfolio/projects/[0-9a-fA-F-]+\|200$ "public, max-age=0, s-maxage=60, must-revalidate";
        ~^(GET|HEAD)\|/api/v1/public/portfolio/images/[0-9a-fA-F-]+/(card|gallery)\|200$ "public, max-age=0, s-maxage=60, must-revalidate";
    }
    map $uri $safe_family {
        default website;
        ~^/api/v1(?:/|$) api;
        ~^/sanctum(?:/|$) csrf;
        ~^/admin(?:/|$) dashboard;
        ~^/health/ health;
    }
    # No URI, query, body, cookie, token, email, Referer or client IP in logs.
    log_format safe escape=json '{"event":"http.access","status":$status,"family":"$safe_family","request_id":"$correlation_id","duration":"$request_time","upstream_status":"$upstream_status"}';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_body;
    fastcgi_temp_path /tmp/fastcgi;
    proxy_temp_path /tmp/proxy;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 12m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 40s;
    limit_req_zone $binary_remote_addr zone=ingress_rate:2m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=ingress_connections:1m;
    upstream application { zone application 64k; server app:9000 resolve; }
    upstream website { zone website 64k; server website:3100 resolve; keepalive 4; }
    upstream dashboard { zone dashboard 64k; server dashboard:3001 resolve; keepalive 4; }

    server {
        listen 8080 default_server;
        server_name _;
        location = /health/edge { access_log off; return 204; }
        location / { return 444; }
    }
    server {
        listen 8080;
        server_name holoul.com.ly www.holoul.com.ly;
        location ^~ /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; }
        location / { return 308 https://holoul.com.ly$request_uri; }
    }
    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
        server_name _;
        return 444;
    }
    server {
        listen 443 ssl;
        server_name www.holoul.com.ly;
        ssl_certificate /run/holoul-tls/fullchain.pem;
        ssl_certificate_key /run/holoul-tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        return 308 https://holoul.com.ly$request_uri;
    }
    server {
        listen 443 ssl;
        server_name holoul.com.ly;
        ssl_certificate /run/holoul-tls/fullchain.pem;
        ssl_certificate_key /run/holoul-tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        if ($canonical_host = 0) { return 400; }
        limit_req zone=ingress_rate burst=40 nodelay;
        limit_req_status 429;
        limit_conn ingress_connections 20;
        limit_conn_status 429;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Request-ID $correlation_id always;
        error_page 413 = @too_large;
        error_page 429 = @rate_limited;
        error_page 500 502 503 504 = @unavailable;
        location @too_large {
            add_header Cache-Control no-store always;
            return 413 '{"error":{"code":"REQUEST_TOO_LARGE","message":"The request could not be completed."},"request_id":"$correlation_id"}';
        }
        location @rate_limited {
            add_header Cache-Control no-store always;
            add_header Retry-After 1 always;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Please retry later."},"request_id":"$correlation_id"}';
        }
        location @unavailable {
            add_header Cache-Control no-store always;
            return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"The service is temporarily unavailable."},"request_id":"$correlation_id"}';
        }
        location ~ ^/(?:api/v1|sanctum)(?:/|$) { include /etc/nginx/holoul-fastcgi.conf; }
        location ~ ^/health/(?:live|ready)$ { include /etc/nginx/holoul-fastcgi.conf; }
        location ~ ^/admin(?:/|$) {
            include /etc/nginx/holoul-proxy.conf;
            # Preserve /admin prefix, including Next assets. No URI suffix.
            proxy_pass http://dashboard;
        }
        location ~ /\.(?!well-known/) { return 404; }
        location / {
            include /etc/nginx/holoul-proxy.conf;
            proxy_pass http://website;
        }
    }
}
