pid /tmp/nginx.pid;
worker_processes auto;
# Ordinary edge errors include raw query strings; sanitized access telemetry
# carries their status instead. Critical process failures remain observable.
error_log /dev/stderr crit;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/json;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $request_id $generated_request_id {
        "~^(.{8})(.{4}).(.{3}).(.{3})(.{12})$" "$1-$2-4$3-8$4-$5";
    }
    map $http_x_request_id $correlation_id {
        "~^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$" $http_x_request_id;
        default $generated_request_id;
    }
    upstream application {
        zone application 64k;
        server app:9000 resolve;
    }
    log_format safe escape=json '{"event":"http.access","method":"$request_method","status":$status,"duration_seconds":"$request_time","request_id":"$correlation_id"}';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_body;
    fastcgi_temp_path /tmp/fastcgi;
    proxy_temp_path /tmp/proxy;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 12m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 30s;

    server {
        listen 8080 default_server;
        server_name _;
        add_header X-Request-ID $correlation_id always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control no-store always;

        error_page 400 403 404 405 408 411 414 415 429 = @invalid;
        location @invalid {
            return 400 '{"error":{"code":"MALFORMED_REQUEST","message":"The request could not be completed."},"request_id":"$correlation_id"}';
        }
        error_page 413 = @too_large;
        location @too_large {
            return 413 '{"error":{"code":"REQUEST_TOO_LARGE","message":"The request could not be completed."},"request_id":"$correlation_id"}';
        }
        error_page 500 502 503 504 = @unavailable;
        location @unavailable {
            return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"The service is temporarily unavailable."},"request_id":"$correlation_id"}';
        }
        location / {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_param HTTP_X_REQUEST_ID $correlation_id;
            # Development has no trusted external reverse proxy.
            fastcgi_param HTTP_X_FORWARDED_FOR "";
            fastcgi_param HTTP_X_FORWARDED_PROTO "";
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass application;
            fastcgi_read_timeout 40s;
            fastcgi_hide_header X-Powered-By;
            fastcgi_hide_header X-Request-ID;
            fastcgi_hide_header Cache-Control;
        }
    }
}
