pid /tmp/nginx.pid;
worker_processes auto;
# Ordinary edge errors include raw query strings; sanitized access telemetry
# carries their status instead. Critical process failures remain observable.
error_log /dev/stderr crit;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/json;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $request_id $generated_request_id {
        "~^(.{8})(.{4}).(.{3}).(.{3})(.{12})$" "$1-$2-4$3-8$4-$5";
    }
    map $http_x_request_id $correlation_id {
        "~^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$" $http_x_request_id;
        default $generated_request_id;
    }
    map $uri $response_cache_control {
        default no-store;
        ~^/api/v1/(admin/)?project-requests/[^/]+/documents(/|$) "private, no-store";
        ~^/api/v1/(admin/)?project-requests/[^/]+/(discovery|proposals)(/|$) "private, no-store";
        ~^/api/v1/(admin/)?projects(/|$) "private, no-store";
    }
    # Local Next.js dev ingress only; never derive trusted metadata from
    # client-supplied Forwarded/X-Forwarded-* values.
    map $http_upgrade $admin_connection_upgrade {
        default upgrade;
        '' close;
    }
    map $http_origin $admin_origin_allowed {
        default 0;
        '' 1;
        'https://localhost:8443' 1;
    }
    map $http_referer $admin_referer_allowed {
        default 0;
        '' 1;
        ~^https://localhost:8443(?:/|$) 1;
    }
    # Laravel's trusted-host middleware is inactive in its local environment.
    # Enforce the same explicit local boundary before any FastCGI request.
    map "$scheme|$http_host" $local_ingress_host_allowed {
        default 0;
        'http|localhost:8080' 1;
        'http|127.0.0.1:8080' 1;
        'https|localhost:8443' 1;
        'https|127.0.0.1:8443' 1;
    }
    upstream application {
        zone application 64k;
        server app:9000 resolve;
    }
    log_format safe escape=json '{"event":"http.access","method":"$request_method","status":$status,"duration_seconds":"$request_time","request_id":"$correlation_id"}';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_body;
    fastcgi_temp_path /tmp/fastcgi;
    proxy_temp_path /tmp/proxy;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 12m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 30s;
    # A local ingress limit remains effective when Redis is unavailable.
    limit_req_zone $binary_remote_addr zone=intake_ingress:10m rate=10r/s;

    # Publish the sandbox UI through the edge so Mailpit itself stays on the
    # internal network with no external route or relay capability.
    server {
        listen 8025;
        server_name localhost 127.0.0.1;
        add_header Cache-Control no-store always;
        location / {
            set $mailbox mailpit:8025;
            proxy_pass http://$mailbox;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 40s;
        }
    }

    server {
        listen 8080 default_server;
        listen 8443 ssl default_server;
        ssl_certificate /run/holoul-tls/certificate.pem;
        ssl_certificate_key /run/holoul-tls/private-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        server_name _;
        add_header X-Request-ID $correlation_id always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control $response_cache_control always;

        error_page 400 403 404 405 408 411 414 415 = @invalid;
        location @invalid {
            return 400 '{"error":{"code":"MALFORMED_REQUEST","message":"The request could not be completed."},"request_id":"$correlation_id"}';
        }
        error_page 429 = @rate_limited;
        location @rate_limited {
            add_header X-Request-ID $correlation_id always;
            add_header Cache-Control $response_cache_control always;
            add_header Retry-After 1 always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Please retry later."},"request_id":"$correlation_id"}';
        }
        error_page 413 = @too_large;
        location @too_large {
            return 413 '{"error":{"code":"REQUEST_TOO_LARGE","message":"The request could not be completed."},"request_id":"$correlation_id"}';
        }
        error_page 500 502 503 504 = @unavailable;
        location @unavailable {
            return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"The service is temporarily unavailable."},"request_id":"$correlation_id"}';
        }
        # This loopback-only development edge is not a production proxy profile.
        # Next.js has basePath=/admin: proxy_pass must have NO URI suffix.
        location ~ ^/admin(?:/|$) {
            if ($https != on) { return 403; }
            if ($http_host != 'localhost:8443') { return 400; }
            if ($admin_origin_allowed = 0) { return 403; }
            if ($admin_referer_allowed = 0) { return 403; }
            if ($http_sec_fetch_site = cross-site) { return 403; }

            # Any local add_header disables inheritance of the API header set.
            # CSP and all dashboard security headers pass through from Next.js.
            add_header X-Request-ID $correlation_id always;
            error_page 400 403 = @admin_invalid;
            error_page 413 = @admin_too_large;
            error_page 500 502 503 504 = @admin_unavailable;
            client_max_body_size 41m;
            set $admin_upstream host.docker.internal:3001;
            proxy_pass http://$admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host localhost:8443;
            proxy_set_header X-Forwarded-Host localhost:8443;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Forwarded '';
            proxy_set_header X-Forwarded-Prefix '';
            proxy_set_header Proxy '';
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $admin_connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 60s;
        }
        location @admin_invalid {
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control no-store always;
            return 403 '{"error":"Local dashboard request rejected."}';
        }
        location @admin_too_large {
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control no-store always;
            return 413 '{"error":"Dashboard request too large."}';
        }
        location @admin_unavailable {
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control no-store always;
            return 503 '{"error":"Local dashboard unavailable."}';
        }
        location / {
            include fastcgi_params;
            if ($local_ingress_host_allowed = 0) { return 400; }
            limit_req zone=intake_ingress burst=40 nodelay;
            limit_req_status 429;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_param HTTP_X_REQUEST_ID $correlation_id;
            # Development has no trusted external reverse proxy.
            fastcgi_param HTTP_X_FORWARDED_FOR "";
            fastcgi_param HTTP_X_FORWARDED_PROTO "";
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass application;
            fastcgi_read_timeout 40s;
            fastcgi_hide_header X-Powered-By;
            fastcgi_hide_header X-Request-ID;
            fastcgi_hide_header Cache-Control;
        }
    }
}
