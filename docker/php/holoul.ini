expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
max_execution_time = 30
post_max_size = 12M
upload_max_filesize = 10M
max_input_vars = 100
date.timezone = UTC
session.use_strict_mode = 1
opcache.enable = 1
opcache.validate_timestamps = 0
