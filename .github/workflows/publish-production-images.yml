name: Publish frozen production images

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact approved application SHA (required; no branch or tag)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-image-publication
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject an unapproved source or execution context
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$GITHUB_REPOSITORY" = mohamedsalama03/holoul-backend
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/ops/production-image-publication
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$SOURCE_SHA" = 8b1ffea5c75dc4adb68f795a73d1c6c513cbbd8c
      - name: Check out publication guard tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify publication guards before building
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s ops/image-publication -p 'test_*.py' -v

  images:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        image: [backend, postgres, redis, storage, portfolio, nginx]
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      IMAGE_KEY: ${{ matrix.image }}
    steps:
      - name: Check out reviewed publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: ops
          persist-credentials: false
      - name: Check out the exact frozen application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Set up pinned BuildKit on the hosted runner
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.2
          driver: docker-container
          driver-opts: image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          buildkitd-flags: ''
      - name: Build once into a local OCI layout (no registry credentials)
        run: python3 ops/ops/image-publication/publish.py build --source source
      - name: Inspect and scan the exact output before publishing
        run: python3 ops/ops/image-publication/publish.py scan --source source
      - name: Publish the scanned bytes and verify a pull by digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ops/ops/image-publication/publish.py publish --source source
      - name: Retain sanitized evidence, including failed gates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-${{ matrix.image }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication/evidence/*.json
          if-no-files-found: warn
          retention-days: 30

  inventory:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Check out publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: ops
          persist-credentials: false
      - name: Check out frozen Compose for read-only validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Download this attempt's six evidence sets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: publication-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication/evidence
          merge-multiple: true
      - name: Require six verified publications and validate frozen Compose
        run: python3 ops/ops/image-publication/publish.py inventory --source source
      - name: Retain the immutable inventory (not deployment authorization)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-image-inventory-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication/inventory/*
          if-no-files-found: error
          retention-days: 90
